name: Exam slot monitor

on:
  schedule:
    # თითო გაშვება ~55 წუთი მუშაობს და ზუსტად ყოველ 5 წუთში ამოწმებს.
    # ხშირი cron უზრუნველყოფს, რომ რიგში ყოველთვის იდგეს შემდეგი გაშვება (concurrency ქვემოთ).
    - cron: "*/5 * * * *"
  workflow_dispatch:         # ხელით გაშვება Actions ჩანართიდან

concurrency:
  group: exam-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # წინა გაშვების მდგომარეობა (ნანახი თარიღები + დაშიფრული ტოკენი)
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            .token.json
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-

      - name: Check slots
        env:
          SA_USERNAME: ${{ secrets.SA_USERNAME }}
          SA_PASSWORD: ${{ secrets.SA_PASSWORD }}
          GMAIL_ADDRESS: ${{ secrets.SA_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CODE_URL: ${{ secrets.CODE_URL }}
          CODE_URL_KEY: ${{ secrets.CODE_URL_KEY }}
          EXAM_CATEGORY: "1"
          EXAM_CENTER: "რუსთავ"
        run: python exam_monitor.py --minutes 55

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state.json
            .token.json
          key: monitor-state-${{ github.run_id }}
